    <script>
        // Inside the portfolio modal the close button replaces this link.
        if (window.self !== window.top) {
            document.querySelectorAll('[data-standalone-only]').forEach(function (el) {
                el.remove();
            });
        }

        // Any screenshot that fails to load falls back to the card art.
        document.addEventListener(
            'error',
            function (event) {
                const img = event.target;
                if (img.tagName !== 'IMG' || img.dataset.fallbackApplied) return;
                img.dataset.fallbackApplied = '1';
                img.removeAttribute('srcset');
                img.removeAttribute('sizes');
                img.src = 'img/seed.png';
            },
            true
        );
